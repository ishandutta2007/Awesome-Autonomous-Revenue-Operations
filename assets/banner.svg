<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .glow-pulse {
        animation: pulseGlow 6s ease-in-out infinite alternate;
      }
      .wave-flow {
        animation: waveShift 12s linear infinite;
      }
      .node-pulse {
        animation: nodePulse 3s ease-in-out infinite alternate;
      }
      .pill-float {
        animation: floatAnim 4s ease-in-out infinite alternate;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes waveShift {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      @keyframes nodePulse {
        0% { r: 4px; opacity: 0.5; }
        100% { r: 7px; opacity: 1; }
      }
      @keyframes floatAnim {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-5px); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#gridPattern)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="glow-pulse" transform-origin="300 180">
    <circle cx="200" cy="100" r="140" fill="#3b82f6" filter="blur(60px)" opacity="0.3" />
    <circle cx="1000" cy="260" r="160" fill="#8b5cf6" filter="blur(70px)" opacity="0.25" />
    <circle cx="650" cy="80" r="100" fill="#ec4899" filter="blur(60px)" opacity="0.2" />
  </g>

  <!-- Animated Data / Pipeline Flow Stream (Underneath Text) -->
  <g opacity="0.35">
    <path d="M 50 310 C 250 250, 450 350, 650 290 C 850 230, 1050 330, 1150 280" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-dasharray="12 8" class="wave-flow" />
    <path d="M 50 330 C 300 270, 500 370, 750 310 C 950 250, 1100 340, 1150 300" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" class="wave-flow" opacity="0.6" />
  </g>

  <!-- Pipeline Metric Micro-Cards (Flanking sides in lower z-index / background) -->
  <g class="pill-float" transform="translate(70, 45)">
    <rect width="140" height="34" rx="17" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#10b981" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">Pipeline: +42%</text>
  </g>

  <g class="pill-float" transform="translate(980, 55)" style="animation-delay: 1.5s;">
    <rect width="150" height="34" rx="17" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#a855f7" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#d8b4fe">Forecast: 98.4%</text>
  </g>

  <g class="pill-float" transform="translate(990, 275)" style="animation-delay: 2.5s;">
    <rect width="140" height="34" rx="17" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#f43f5e" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fbcfe8">AI Agents: 24/7</text>
  </g>

  <g class="pill-float" transform="translate(70, 275)" style="animation-delay: 3s;">
    <rect width="155" height="34" rx="17" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#06b6d4" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a5f3fc">Zero Data Entry</text>
  </g>

  <!-- Foreground Main Title & Content -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <g transform="translate(600, 75)">
      <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="url(#primaryGrad)" stroke-width="1.5" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc" letter-spacing="1.5">⚡ REVOPS INTELLIGENCE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Awesome Autonomous RevOps
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Autonomous Revenue Operations, Revenue Intelligence &amp; AI CRM Engines
    </text>

    <!-- Feature Pillars List in Foreground -->
    <text x="600" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      Pipeline Intelligence  •  Predictive Forecasting  •  Activity Capture  •  Self-Hosted CRM &amp; AI SDRs
    </text>
  </g>

  <!-- Border Frame Glow -->
  <rect width="1196" height="356" x="2" y="2" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6" />
</svg>
